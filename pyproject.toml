[project]
name = "slack-digest-agent"
version = "0.1.0"
description = "AI-powered Slack digest agent with local semantic scoring"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "slack-bolt>=1.18",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "schedule>=1.2",
]

[project.scripts]
slack-digest = "slack_digest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_digest"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
